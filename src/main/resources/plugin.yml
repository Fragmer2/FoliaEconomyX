name: BurzhuyPlugin
main: me.yourname.burzhuy.BurzhuyPlugin
version: 2.0.4
api-version: '1.21'
author: BohdanStepantsov
depend: [Vault]
folia-supported: true

commands:
  buyer:
    description: Open the buyer menu
    usage: /buyer
    aliases: [shop, merchant]
  upgradebuyer:
    description: Open slot upgrade menu
    usage: /upgradebuyer
  refreshlots:
    description: Refresh player lots (admin)
    usage: /refreshlots <player>
    permission: burzhuy.admin
  slotupgrademenu:
    description: Open slot upgrade menu
    usage: /slotupgrademenu
  multiplierquest:
    description: Open multiplier quest menu
    usage: /multiplierquest
    aliases: [mquest, quests]

permissions:
  burzhuy.admin:
    description: Admin permission for refreshing lots
    default: op
  burzhuy.slotupgrademenu:
    description: Open slot upgrade menu
    default: true
  burzhuy.buyer:
    description: Open buyer menu
    default: true
  burzhuy.multiplierquest:
    description: Open multiplier quest menu
    default: true
  burzhuy.maxslots.14:
    description: Maximum 14 slots
    default: false
  burzhuy.maxslots.16:
    description: Maximum 16 slots
    default: false
  burzhuy.maxslots.18:
    description: Maximum 18 slots
    default: false
  burzhuy.maxslots.20:
    description: Maximum 20 slots
    default: false
  burzhuy.maxslots.22:
    description: Maximum 22 slots
    default: false
  burzhuy.maxslots.12:
    description: Maximum 12 slots (default)
    default: true
