name: FoliaEconomyX
version: '${project.version}'
main: com.yourname.foliaeconomyx.FoliaEconomyX
api-version: '1.21'
folia-supported: true
author: YourName
description: Advanced multi-currency economy plugin for Folia
website: https://yourwebsite.com

depend: [Vault]
softdepend: [PlaceholderAPI, LuckPerms]

commands:
  money:
    description: Check your balance
    usage: /money [currency] [player]
    aliases: [balance, bal]
    permission: foliaeconomyx.money
    
  pay:
    description: Send money to another player
    usage: /pay <player> <amount> [currency]
    permission: foliaeconomyx.pay
    
  eco:
    description: Economy admin commands
    usage: /eco <give|take|set|reset> <player> <amount> [currency]
    permission: foliaeconomyx.admin
    aliases: [economy]
    
  baltop:
    description: View richest players
    usage: /baltop [currency] [page]
    aliases: [balancetop, topbalance]
    permission: foliaeconomyx.baltop
    
  currency:
    description: Currency management
    usage: /currency <list|info|convert>
    aliases: [currencies, cur]
    permission: foliaeconomyx.currency
    
  ecomirgrate:
    description: Migrate data from other plugins
    usage: /ecomigrate <essentials|cmi|playerpoints>
    permission: foliaeconomyx.migrate
    
  ecohistory:
    description: View transaction history
    usage: /ecohistory [player] [page]
    permission: foliaeconomyx.history

permissions:
  foliaeconomyx.*:
    description: All permissions
    default: op
    children:
      foliaeconomyx.money: true
      foliaeconomyx.money.others: true
      foliaeconomyx.pay: true
      foliaeconomyx.pay.donate: true
      foliaeconomyx.baltop: true
      foliaeconomyx.currency: true
      foliaeconomyx.admin: true
      foliaeconomyx.migrate: true
      foliaeconomyx.history: true
      foliaeconomyx.history.others: true
      
  foliaeconomyx.money:
    description: Check your own balance
    default: true
    
  foliaeconomyx.money.others:
    description: Check other players' balance
    default: op
    
  foliaeconomyx.pay:
    description: Send regular currency
    default: true
    
  foliaeconomyx.pay.donate:
    description: Send donate currency (with confirmations)
    default: true
    
  foliaeconomyx.pay.bypass:
    description: Bypass donate currency confirmations
    default: op
    
  foliaeconomyx.baltop:
    description: View baltop
    default: true
    
  foliaeconomyx.currency:
    description: View currency info
    default: true
    
  foliaeconomyx.admin:
    description: Admin economy commands
    default: op
    
  foliaeconomyx.migrate:
    description: Migrate from other plugins
    default: op
    
  foliaeconomyx.history:
    description: View your transaction history
    default: true
    
  foliaeconomyx.history.others:
    description: View others' transaction history
    default: op
