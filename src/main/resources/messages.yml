# BurzhuyPlugin Language File - English
# All player-facing messages

# General Messages
messages:
  buyer_refreshed: "&eThe Buyer has been refreshed! Items have been shuffled."
  no_permission: "&cYou don't have permission to use this command!"
  player_only: "&cOnly players can use this command!"
  player_not_found: "&cPlayer not found!"
  error_loading_data: "&cError loading your data!"
  error_opening_menu: "&cError opening menu!"
  
# Buyer Menu
buyer:
  insufficient_items: "&cYou don't have enough items to sell!"
  sold_items: "&aYou sold {amount} x {name} for ${price} &7(Multiplier: x{multiplier})"
  
# Slot Upgrade
slot_upgrade:
  success: "&6You spent &e${cost}&6 coins. Remaining: &e${balance}&6 coins."
  insufficient_funds: "&cInsufficient funds! Required: &e${cost}&c coins, you have: &e${balance}&c."
  max_slots_reached: "&cYou already have the maximum number of slots!"
  error_upgrading: "&cError upgrading slots!"
  error_withdrawing: "&cError withdrawing funds!"
  
# Quest System
quests:
  completed: "&eQuest completed: {name}"
  progress: "&eQuest progress: {name} [{current}/{total}]"
  all_completed_level_up: "&aAll quests completed! Multiplier upgraded to level {level}."
  all_completed_max_level: "&aAll quests completed! Maximum multiplier level reached."
  no_items_to_deliver: "&cYou don't have the required items to complete this quest!"
  delivered_items: "&aYou delivered {amount} {item} for the quest!"
  
# Quest Names (from config)
quest_names:
  zombie_kill: "&6Kill &e10 &6zombies"
  skeleton_kill: "&6Kill &e7 &6skeletons"
  iron_golem_kill: "&6Defeat &e3 &6iron golems"
  wither_kill: "&6Defeat &e1 &6wither"
  spider_kill: "&6Kill &e15 &6spiders"
  deliver_golden_apple: "&6Deliver &e6 &6golden apples"
  deliver_totem: "&6Deliver &e2 &6totems of undying"
  deliver_glowstone_dust: "&6Deliver &e32 &6glowstone dust"
  deliver_ender_pearl: "&6Deliver &e16 &6ender pearls"
  deliver_diamond_block: "&6Deliver &e6 &6diamond blocks"
  break_stone: "&6Mine &e300 &6stone"
  break_diamond_ore: "&6Mine &e24 &6diamond ore"
  break_soul_sand: "&6Mine &e128 &6soul sand"
  break_ancient_debris: "&6Mine &e8 &6ancient debris"
  craft_anvil: "&6Craft &e10 &6anvils"
  craft_beacon: "&6Craft &e3 &6beacons"
  craft_golden_apple: "&6Craft &e5 &6golden apples"
  pickup_elytra: "&6Pick up &e1 &6elytra"
  travel_nether: "&6Visit &ethe Nether"
  travel_end: "&6Visit &ethe End"
  walk_distance: "&6Walk &e2500 &6blocks"
  visit_ocean: "&6Visit an ocean"
  jump: "&6Jump &e100 &6times"
  use_totem: "&6Use &e1 &6totem of undying"
  drink_strength_potion: "&6Drink &e3 &6strength potions"
  
# Menu Titles
menu_titles:
  buyer: "&6&l☀ BUYER ☀ &e(Level &6{level}&e)"
  slot_upgrade: "&6&l☀ Upgrades ☀"
  multiplier_quest: "&6&l☀ Multiplier Quests ☀"
  
# Menu Items
menu_items:
  # Buyer Menu
  buyer_info:
    name: "&6&lInformation"
    lore:
      - "&e• &7Available slots: &6{slots}&e/&6{max_slots}"
      - "&e• &7Your multiplier: &6{multiplier}&ex"
      - "&7Time until reset: &e{reset_timer}"
      - ""
      - "&fTrade resources — earn &6rewards&f!"
      
  buyer_upgrade:
    name: "&6&lUpgrade Slots"
    lore:
      - "&eOpen upgrade menu"
      - "&6▸ &eLeft Click - to open!"
      - "&6▸ &eRight Click - to open!"
      - ""
      
  buyer_sell_item:
    name: "&e{name}"
    lore:
      - ""
      - "&7Price per 1: &6${price} &7(x{multiplier})"
      - ""
      
  # Slot Upgrade Menu
  slot_button:
    name: "&6&lAdd Slot"
    lore:
      - "&eCost: &6{cost} coins"
      - ""
      - "{availability}"
      - "&6▸ &eLMB — buy slot"
      - "&6▸ &eRMB — buy slot"
      - ""
    available: "&a✓ Available for purchase!"
    not_available: "&c✗ Insufficient funds"
    
  quest_button:
    name: "&6&lMultiplier Quests"
    lore:
      - "&eComplete quests to increase your multiplier!"
      
  back_button:
    name: "&cBack"
    lore: []
    
  # Multiplier Quest Menu
  quest_icon:
    name: "&6{name}"
    lore:
      - "&f{status}"
      - "&eProgress: &6{progress}&e/&6{amount}"
      - ""
      - "&6▸ &eLMB - To deliver item!"
      - "&6▸ &eRMB - To deliver item!"
      
  quest_completed_status: "&6✔ &eCompleted!"
  quest_inprogress_status: "&6⏳ &eIn progress"
  
  all_quests_completed:
    name: "&6All quests completed!"
    lore:
      - "&eYou've already reached maximum multiplier!"
      
  glass_pane:
    name: "&e "

# Admin Commands
admin:
  lots_refreshed: "&aLots for {player} have been refreshed!"
  lots_refreshed_target: "&aYour lots have been refreshed by an administrator!"
  refresh_usage: "&eUsage: /refreshlots <player>"

# Error Messages
errors:
  vault_not_found: "&cVault not found! Plugin disabling."
  no_quests_in_config: "&c[burzhuy] No quests section found in config!"
  quest_load_error: "&c[burzhuy] Error loading quest '{key}': {error}"
  insufficient_quests: "&c[burzhuy] Not enough quests to assign! Need at least 3, current: {count}"
  invalid_material: "&cUnknown material in config ({section}): {key}"
  
# Success Messages
success:
  plugin_enabled: "BurzhuyPlugin successfully started!"
  plugin_disabled: "BurzhuyPlugin stopped."
  quests_loaded: "[burzhuy] Total multiplier quests loaded: {count}"
  quest_loaded: "[burzhuy] Quest loaded: {name} ({type}), amount={amount}, target={target}"
