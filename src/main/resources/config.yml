upgrade_slot_cost:
  base: 80000
  per_slot: 10000

multiplier:
  base: 1.0
  per_level: 0.4
  max_level: 5

menu:
  buyer:
    title: "&6&l☀ Buyer ☀"
    size: 54
    glass:
      material: ORANGE_STAINED_GLASS_PANE
      name: "&e "
    info:
      slot: 4
      material: GOLD_INGOT
      name: "&6&lInformation"
      lore:
        - "&e• &7Available slots: &6{slots}&e/&6{max_slots}"
        - "&e• &7Your multiplier: &6{multiplier}&ex"
        - "&7Time until reset: &e{reset_timer}"
        - ""
        - "&fTrade resources — earn &6rewards&f!"
    upgrade:
      slot: 8
      material: CHEST
      name: "&6&lUpgrade Slots"
      lore:
        - "&eOpen upgrade menu"
        - "&6▸ &eLMB - to open!"
        - "&6▸ &eRMB - to open!"
        - ""
    sell_slots: [10, 11, 12, 13, 14, 15, 16, 20, 21, 22, 23, 24, 28, 29, 30, 31, 32, 33, 34, 39, 40, 41]
    sell_item:
      name: "&e{name}"
      lore:
        - ""
        - "&7Price per 1: &6${price} &7(x{multiplier})"
        - ""
        
  multiplier_quest:
    title: "&6&l☀ Multiplier Quests ☀"
    size: 27
    glass:
      material: ORANGE_STAINED_GLASS_PANE
      name: "&e "
    quest_icon:
      material: PAPER
      name: "&6{name}"
      lore:
        - "&f{status}"
        - "&eProgress: &6{progress}&e/&6{amount}"
        - ""
        - "&6▸ &eLMB - To deliver item!"
        - "&6▸ &eRMB - To deliver item!"
    completed_status: "&6✔ &eCompleted!"
    inprogress_status: "&6⏳ &eIn progress"
    completed_button:
      slot: 16
      material: EXPERIENCE_BOTTLE
      name: "&6All quests completed!"
      lore:
        - "&eYou've reached maximum multiplier!"
    back_button:
      slot: 22
      material: ARROW
      name: "&cBack"
      lore: []

  slot_upgrade:
    title: "&6&l☀ Upgrades ☀"
    size: 27
    glass:
      material: ORANGE_STAINED_GLASS_PANE
      name: "&e "
    slot_button:
      slot: 12
      material: CHEST
      material_locked: BARRIER
      name: "&6&lAdd Slot"
      lore:
        - "&eCost: &6{cost} coins"
        - ""
        - "{availability}"
        - "&6▸ &eLMB — buy slot"
        - "&6▸ &eRMB — buy slot"
        - ""
      available: "&a✓ Available for purchase!"
      not_available: "&c✗ Insufficient funds"
    quest_button:
      slot: 14
      material: EXPERIENCE_BOTTLE
      name: "&6&lMultiplier Quests"
      lore:
        - "&eComplete quests to increase multiplier!"
    back_button:
      slot: 26
      material: ARROW
      name: "&cBack"
      lore: []

